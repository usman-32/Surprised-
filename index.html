<!DOCTYPE html>
<html>
<head>
<title>Usman ❤️ Malaika</title>
<style>
body {
  background: linear-gradient(to bottom, #ff1e56, #ffac41);
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  padding-top: 80px;
  overflow: hidden;
}

/* Floating Roses */
.rose {
  position: fixed;
  top: -50px;
  font-size: 30px;
  animation: fall 10s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-100px); opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0; }
}

h1 {
  font-size: 50px;
  text-shadow: 0 0 20px red;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  background: white;
  color: red;
  cursor: pointer;
  margin: 10px;
}

button:hover {
  background: red;
  color: white;
}
</style>
</head>

<body>

<h1>Usman ❤️ Malaika</h1>
<h2>My love, will you be my Valentine forever? 💖</h2>

<button onclick="yesLove()">YES 😍</button>
<button onclick="noLove()">NO 😢</button>

<script>
// Falling Roses
for(let i=0; i<30; i++){
  let rose = document.createElement("div");
  rose.innerHTML = "🌹";
  rose.className = "rose";
  rose.style.left = Math.random()*100 + "vw";
  rose.style.animationDuration = (5 + Math.random()*5) + "s";
  document.body.appendChild(rose);
}

function yesLove() {
  document.body.innerHTML = `
  <h1>💖 Malaika Said YES! 💖</h1>
  <h2>I love you forever, Malaika 🌹</h2>
  <p>— Your Husband Usman</p>
  `;
}

function noLove() {
  alert("Please say YES Malaika 😭💔");
}
</script>

</body>
</html>
