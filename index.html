<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usman ❤️ Malaika</title>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background:url("https://images.unsplash.com/photo-1517849845537-4d257902454a") no-repeat center center/cover;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

#box {
  background:rgba(0,0,0,0.6);
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 0 25px black;
}

h1 {
  font-size:26px;
  color:#ff4d6d;
}

p {
  font-size:18px;
}

button {
  padding:12px 25px;
  border:none;
  border-radius:25px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#yes {background:red;color:white;}
#no {background:white;color:red;position:absolute;}
</style>
</head>

<body>

<div id="box">
<h1>🌹 Usman ❤️ Malaika 🌹</h1>
<p>My beautiful wife Malaika, you are my world 💖</p>
<p id="q">Will you stay with me forever?</p>

<button id="yes" onclick="love()">YES 😘</button>
<button id="no" onmouseover="moveNo()">No 😜</button>

<p id="msg"></p>
</div>

<script>
const noBtn=document.getElementById("no");

function moveNo(){
 let x=Math.random()*200-100;
 let y=Math.random()*100-50;
 noBtn.style.transform=`translate(${x}px,${y}px)`;
}

function love(){
 document.getElementById("msg").innerHTML =
 "Malaika 💕 I love you so much! You are my rose 🌹 forever. Your husband Usman ❤️";
}
</script>

</body>
</html>
function noLove() {
  alert("Please say YES Malaika 😭💔");
}
</script>

</body>
</html>
